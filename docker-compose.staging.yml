# Staging backend: a tagged image on the build rag_meta.serving(env='staging')
# names (`ragdata promote --env staging`, docs/rebuild_pipeline.md §6), on :8002.
# Always layered on the base file and started by naming the service:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#     up -d --no-deps --no-build --wait --wait-timeout 300 backend-stg
#
# STG_IMAGE picks the tag (default bible_rag-backend:r2). pull_policy never: the
# image must already be local (host link ~50 KB/s).

name: bible_rag

services:
  # Same env as the production backend (.env plus the container-network hosts),
  # with RAG_ENV=staging, offline models and the contract directories read-only.
  # No depends_on: postgres, qdrant and ollama are the running production
  # services, and naming them would let `up` converge (recreate) them. A failed
  # handshake exits the process (STRICT_BUILD_CHECK defaults to true), so
  # `--wait` fails instead of serving, and restart "no" keeps it exited: any
  # other policy would reload the models after every back-off. After a host
  # reboot, run the `up` command above again.
  backend-stg:
    image: ${STG_IMAGE:-bible_rag-backend:r2}
    pull_policy: never
    profiles: ["stg"]
    container_name: bible_rag_backend_stg
    restart: "no"
    ports:
      - "${BACKEND_STG_PORT:-8002}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_ENV: staging
      HF_HUB_OFFLINE: "1"
      CONTRACTS_ROOT: /contracts
    volumes:
      - model_cache:/root/.cache
      - ${RAG_STORE:-/mnt/ollama-data/bible_rag_store}/contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
