# Pinned project name: a worktree checkout (e.g. ~/Bible_RAG-rb) joins the running
# bible_rag project, its network and its bible_rag_* volumes instead of starting a
# second stack under its directory name.
name: bible_rag

services:
  # FastAPI backend. Runs a prebuilt, tagged image and never builds on `up`: the
  # tag is the one `ragdata promote` recorded (docs/rebuild_pipeline.md §6). Build
  # a new tag with `docker build --build-context uvcache=$HOME/.cache/uv-bible-rag-backend
  # -t bible_rag-backend:<tag> .`, promote it, then point `image` at it.
  backend:
    image: bible_rag-backend:r2
    pull_policy: never
    container_name: bible_rag_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override hosts to use Docker service names
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      # The build comes from rag_meta.serving's row for RAG_ENV (design §7.8);
      # its contract files from the read-only mount below.
      RAG_ENV: prod
      STRICT_BUILD_CHECK: "true"
      CONTRACTS_ROOT: /contracts
      # Models load from the model_cache volume only (host link ~50 KB/s).
      HF_HUB_OFFLINE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      # Every build's contract directory, selected by the serving build id.
      - ${RAG_STORE:-/mnt/ollama-data/bible_rag_store}/contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # PostgreSQL with pgvector extension for structured data
  postgres:
    image: pgvector/pgvector:pg15
    container_name: bible_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bible_rag}
      POSTGRES_USER: ${POSTGRES_USER:-bible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bible_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Schemas are created by the ragdata loader (b{build_id}, rag_meta), never
      # by an init script.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bible} -d ${POSTGRES_DB:-bible_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant vector database for embeddings
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: bible_rag_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM inference server
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - type: bind
        source: /mnt/ollama-data/ollama
        target: /root/.ollama
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
