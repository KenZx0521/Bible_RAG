# S4 errata 覆寫層（DESIGN §2.12、稽核 G11、決策 D-03(b)）
#
# PDF 本身印錯 9 種字、共 25 處，全在同一段 Big5 碼位 E041–E050：每個錯字都是
# 該碼位在標準 Big5 的字（詷=E04A、詵=E04D…），顯示原稿在這段碼位放了自造字。
# 同一段的 E046「誆」在士14:15、16:5、撒下3:25、王上13:18 都是正確的「誆哄」，不是錯字。
#
# 規則：text_pdf 永遠保留印出的字；status=apply 的錯字在 text 的同一位置換成正字
# （等長、只換這一個字），容器記下 errata id；status=uncertain 只列出、不套用。
# 建置時逐條驗證（不合就整個建置失敗）：
#   - 每筆的容器在該 offset 確實是該錯字；
#   - PDF 文字中每一處錯字都有一筆（不會漏網）；
#   - 正字在整份 PDF 文字中出現 0 次（G11：凡該印正字處都印成錯字），寫入 evidence。
# 查證方式：上下文的詞義，加上同一錯字在各處的用法一致。
# 套用的錯字是 curated_human（Kay 依 PDF 證據裁決），所以 decided_by 必須是 kay。
# 2026-10-08 Kay 裁決：原本 4 種、19 處的建議整體採納；詞確定但正字有兩種通行字形、
# PDF 他處又無從對照的 5 種（6 處）由 Kay 定字形：訿→灶、誄→蔥、誁→麅、詴→虻、觢→敕。
# 25 處全部 apply。本 PDF 用字不依台灣標準字形（着 2,649 對著 5、裏 4,796 對裡 0、
# 污 269 對汙 0），字形是 Kay 的裁決，不是由某個字形標準推出。
schema: ragdata.errata.v1
class: big5_e04x_misglyph
decided_by: kay
not_errata:
  誆: {big5: E046, why: 4 處都是「誆哄」（哄騙），詞義與上下文相符}
misglyphs:
  觠:
    big5: E041
    status: apply
    corrected: 兔
    word: 兔子
    why: 利11:6「X子－因為倒嚼不分蹄」、申14:7「駱駝、X子、沙番」；不潔淨的倒嚼動物清單，即兔子
  觢:
    big5: E042
    status: apply
    corrected: 敕
    word: 敕令
    why: >-
      徒19:13 趕鬼者說「我奉保羅所傳的耶穌X令你們出來」，詞是敕令（命令）；
      「敕」「勅」PDF 內都出現 0 次，Kay 2026-10-08 定為「敕」
  訿:
    big5: E049
    status: apply
    corrected: 灶
    word: 爐灶
    why: >-
      出8:3 青蛙「進你的爐X和你的摶麵盆」，詞是爐灶；
      「灶」「竈」PDF 內都出現 0 次，Kay 2026-10-08 定為「灶」
  詷:
    big5: E04A
    status: apply
    corrected: 秕
    word: 糠秕
    why: 7 處都是「糠X」且多與「被風吹散」「碎稭」「麥子」並列（詩1:4、伯21:18、耶23:28），即糠秕
  誄:
    big5: E04C
    status: apply
    corrected: 蔥
    word: 蔥
    why: >-
      民11:5「黃瓜、西瓜、韭菜、X、蒜」，蔬菜清單，詞是蔥；
      「蔥」「葱」PDF 內都出現 0 次，Kay 2026-10-08 定為「蔥」
  詵:
    big5: E04D
    status: apply
    corrected: 蹚
    word: 蹚水
    why: 9 處都是涉水（「X過約旦河」「使我X過水，水到踝子骨」「露腿X河」「X渾之泉」），即蹚
  誃:
    big5: E04E
    status: apply
    corrected: 鬃
    word: 鬃
    why: 伯39:19「牠（馬）頸項上挓挲的X」，即馬鬃
  誁:
    big5: E04F
    status: apply
    corrected: 麅
    word: 麅子
    why: >-
      申14:5「鹿、羚羊、X子、野山羊」、王上4:23「鹿、羚羊、X子，並肥禽」，詞義是麅（狍）；
      「麅」「狍」PDF 內都出現 0 次，Kay 2026-10-08 定為「麅」
  詴:
    big5: E050
    status: apply
    corrected: 虻
    word: 牛虻
    why: >-
      耶46:20 註腳「或譯：牛X」，經文同節是「出於北方的毀滅」，詞是牛虻；
      「虻」「蝱」PDF 內都出現 0 次，Kay 2026-10-08 定為「虻」
