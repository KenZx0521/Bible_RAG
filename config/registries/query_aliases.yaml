# 問句排除語境：命中處落在 context 裏時不算 surface 的命中（K4 規則 rt.exclude_context，與 name_normalization 的 exclude_contexts 一起進詞表）。
# rt.common_word 只量 PDF 經文；這裏收現代問句裏跨在罕用二字名上的常用詞，依語法類別列，不依任何題庫逐題調。
question_exclusions:
  # 疑問詞「如何／為何／任何」的「何」接動詞：不是何字開頭的名稱
  - {surface: 何提, context: 如何提, why: "問句「如何提醒／如何提到」裏的「何提」不是名稱何提"}
  - {surface: 何提, context: 為何提, why: "問句「為何提到…」裏的「何提」不是名稱何提"}
  - {surface: 何提, context: 任何提, why: "「任何提到…」裏的「何提」不是名稱何提"}
  - {surface: 何把, context: 如何把, why: "問句「如何把…」裏的「何把」不是名稱何把"}
  - {surface: 何把, context: 為何把, why: "問句「為何把…」裏的「何把」不是名稱何把"}
  - {surface: 何把, context: 任何把, why: "「任何把…」裏的「何把」不是名稱何把"}
  - {surface: 何利, context: 如何利, why: "問句「如何利用」裏的「何利」不是名稱何利"}
  - {surface: 何利, context: 為何利, why: "問句「為何利未人…」裏的「何利」不是名稱何利（應比到利未）"}
  - {surface: 何坦, context: 如何坦, why: "問句「如何坦然／坦白」裏的「何坦」不是名稱何坦"}
  # 代名詞「他」接動詞「施洗、施行、施恩」：不是地名他施
  - {surface: 他施, context: 他施洗, why: "「為他施洗」是給他施洗，不是地名他施"}
  - {surface: 他施, context: 他施行, why: "「為他施行神蹟」是給他施行，不是地名他施"}
  - {surface: 他施, context: 他施恩, why: "「向他施恩」是給他施恩，不是地名他施"}
  # 現代常用詞跨在名稱上
  - {surface: 中門, context: 中門徒, why: "「其中門徒／當中門徒」是「門徒」，不是城門中門"}
  - {surface: 以別, context: 以別人, why: "「以別人為重」是介詞「以」＋「別人」"}
  - {surface: 以法, context: 以法律, why: "「以法律為…」是介詞「以」＋「法律」"}
  - {surface: 以結, context: 以結論, why: "「以結論收尾」是介詞「以」＋「結論」"}
  - {surface: 以結, context: 以結束, why: "「以結束」是介詞「以」＋「結束」"}
  - {surface: 本都, context: 基本都, why: "「基本都…」是「基本」＋「都」，不是地名本都"}
  - {surface: 本都, context: 根本都, why: "「根本都…」是「根本」＋「都」，不是地名本都"}
