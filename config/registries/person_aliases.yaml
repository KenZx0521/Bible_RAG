# Two names of one person, as the PDF itself says. The kinship identity (ragdata.kg.person_identity)
# reads this table: a rename joins the two names' people, a footnote pair only lets a child's two
# fathers agree (亞比央 and 亞比雅 are one father, not a conflict). Every pair names where the PDF says it,
# and the build checks that both names are written there: a verse for a rename, a footnote and its
# verse for a footnote pair.
schema: ragdata.person_aliases.v1
rename:           # scope: where the pair holds, O Old Testament, N New Testament narrative
  - {old: 亞伯蘭, new: 亞伯拉罕, scope: O, evidence: gen.17.5}
  - {old: 撒萊, new: 撒拉, scope: O, evidence: gen.17.15}
  - {old: 雅各, new: 以色列, scope: O, evidence: gen.32.28}
  - {old: 耶路‧巴力, new: 基甸, scope: O, evidence: jdg.6.32}
  - {old: 掃羅, new: 保羅, scope: N, evidence: act.13.9}
  - {old: 西門, new: 彼得, scope: N, evidence: mat.10.2}
  - {old: 西門‧彼得, new: 彼得, scope: N, evidence: jhn.1.40}
  - {old: 瑪探雅, new: 西底家, scope: O, evidence: 2ki.24.17}
footnote:
