# - name_heading_id：事件名取自的 PDF 標題；省略＝人工名（name_source curated）。
# - pdf_terms：{text, at}，at 是標題 id 或 unit key，必須落在本事件的錨點內；decided_by 由頂層帶入。
# - external_aliases：{text, source?, note?}，缺的欄位取 external_alias_defaults。
# - retired：併入其他事件的 id（不重新編號）；legacy_ids 也列在 merged_into 事件的 legacy_ids 裏。
