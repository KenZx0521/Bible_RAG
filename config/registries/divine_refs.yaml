# kg0 extra_spans 的 divine_rule 來源（DESIGN §2.17、§5.2；REPORT G05、G43）。
# PDF 依體例不給神名、稱謂與頭銜畫專名線；這裏列出要補成 span 的字串。
# 比對：只在正文（verse_units.text_pdf），最長優先、由左到右、互不重疊，
# 而且不碰任何 PDF 底線 span（例如「巴‧耶穌」act.13.6 裏的耶穌不算）。
# 身分（耶和華／耶穌／某位人間的主）不在這裏決定，留給 mention 層（D-21）。
schema: ragdata.divine_refs.v1
what: 正文中依體例不畫線的神名、稱謂與頭銜
region: body
span_patterns:
  - {id: dr.span.001, surface: 主耶穌基督, what: 複合稱謂整段算一個 span}
  - {id: dr.span.002, surface: 主耶和華, what: 「主耶和華」（以西結書常見）整段算一個 span}
  - {id: dr.span.003, surface: 主耶穌, what: 複合稱謂}
  - {id: dr.span.004, surface: 耶穌基督, what: 複合稱謂}
  - {id: dr.span.005, surface: 基督耶穌, what: 複合稱謂}
  - {id: dr.span.006, surface: 耶和華, what: 神名}
  - {id: dr.span.007, surface: 上帝, what: 神名（RCUV 用「上帝」）}
  - {id: dr.span.008, surface: 耶穌, what: 人名，依體例不畫線}
  - {id: dr.span.009, surface: 基督, what: 稱謂}
  - {id: dr.span.010, surface: 聖靈, what: 神名}
  - {id: dr.span.011, surface: 人子, what: 稱謂（福音書指耶穌；以西結書指先知）}
  - {id: dr.span.012, surface: 救主, what: 稱謂}
  - {id: dr.span.013, surface: 法老, what: 埃及王的頭銜，依體例不畫線}
  - {id: dr.span.014, surface: 主, what: 稱謂；指上帝、耶穌或人間的主，由 mention 層判定}
  - {id: dr.span.015, surface: 神, what: 神；多指外邦的神，由 mention 層判定}
# 單字「主」「神」落在下列詞裏時不是稱謂，不成 span。詞表依 PDF 正文實際出現的詞擬定；
# 括號是 PDF 出處。保留（不排除）的例子：「我主」（對人的稱呼，仍是稱謂）、救贖主、
# 救世主、萬主之主、主宰、主日（都指主）、為主治理（太20:25「君王為主治理他們」）、
# 作主的僕人（西4:7＝在主裏作僕人）、別神／假神／眾神／諸神／萬神／真神／活神／女神／山神／家神。
exclusions:
  主:
    - {word: 主人, why: 主僕、物主關係裏的「主人」（創24:9 他主人亞伯拉罕），不是稱謂}
    - {word: 主母, why: 婢女的「主母」（創16:4）}
    - {word: 主意, why: 「出主意、定了主意」的主意（出18:19、林前2:2）}
    - {word: 主謀, why: 「給他主謀」＝出計謀（代下22:3）}
    - {word: 主張, why: 「權柄主張自己的身子」＝支配（林前7:4）}
    - {word: 主治的, why: 「主治的」＝權勢、統治者（弗1:21、西1:16、猶1:8）}
    - {word: 主治之, why: 「輕慢主治之人」＝權柄（彼後2:10）}
    - {word: 代替他作主, why: 「作主」＝當家、作決定（創30:2）}
    - {word: 在家中作主, why: 同上（斯1:22）}
    - {word: 你作主, why: 「價銀不是你作主嗎」＝由你支配（徒5:4）}
    - {word: 自己作主, why: 同上（林前7:37）}
    - {word: 心裏作主, why: 「基督的平安在你們心裏作主」＝掌管，動詞（西3:15）}
    - {word: 自主, why: 「自主的」＝自由人，與「為奴的」相對（林前12:13、加4:22）}
    - {word: 公主, why: 王的女兒（撒下13:18）}
    - {word: 君主, why: 「列國的君主」＝統治者，一個詞（賽16:8）}
    - {word: 恩主, why: 「恩主」＝施恩者（路22:25）；耶3:4「我幼年的恩主」是對上帝說的，但詞義仍是恩主，從缺不錯連}
    - {word: 財主, why: 富人（得2:1、太19:23）}
    - {word: 債主, why: 放債的人（申15:2）}
    - {word: 家主, why: 一家之主（出22:8、太20:1；含「家主母」王上17:17）}
    - {word: 本主, why: 物的原主人（出22:11）}
    - {word: 原主, why: 地或物的原主人（利27:24）}
    - {word: 買主, why: 買方（利25:28）}
    - {word: 賣主, why: 賣方（利27:24、結7:12）}
    - {word: 房主, why: 房子的主人（利14:35、士19:22）}
    - {word: 船主, why: 船的主人（拿1:6）}
    - {word: 園主, why: 葡萄園的主人（太20:8）}
    - {word: 田主, why: 田的主人（太13:27）}
    - {word: 店主, why: 客店的主人（路10:35）}
    - {word: 牛主, why: 牛的主人（出21:29）}
    - {word: 井主, why: 井的主人（出21:34）}
    - {word: 驢主, why: 驢的主人（出23:5）}
    - {word: 物主, why: 財物的主人（傳5:11）}
  神:
    - {word: 神蹟, why: 奇事（出4:8）}
    - {word: 神人, why: 「神人」＝上帝的人，指先知等人（申33:1 神人摩西）}
    - {word: 神像, why: 偶像（創31:19）}
    - {word: 精神, why: 人的精力（申34:7）}
    - {word: 心神, why: 人的心思（詩143:7、賽19:3）}
    - {word: 勞神, why: 費心（賽47:12、15）}
    - {word: 傳神, why: 「用眼傳神」＝示意（箴6:13、10:10）}
    - {word: 神氣, why: 眼神（創29:17）}
    - {word: 神不守舍, why: 失魂（王上10:5、歌5:6）}
    - {word: 神性, why: 上帝的屬性，不是稱呼（徒17:29、羅1:20）}
    - {word: 神堂, why: 供神的屋子（士17:5）}
    - {word: 神語, why: 「王的嘴中有神語」＝神諭（箴16:10）}
    - {word: 神明, why: 「願神明重重地降罰」＝眾神，一個詞，與設計書所舉「神祇」同類（王上19:2、但2:11）；PDF 沒有「神祇」}
    - {word: 神靈, why: 「有一個神靈出來」＝靈（王上22:21）}
    - {word: 神子, why: 「好像神子」（但3:25）}
    - {word: 鬼神, why: 「外邦鬼神」（徒17:18、22）}
    - {word: 神星, why: 「你們的神星」＝星神（摩5:26）}
    - {word: 神道, why: 「別是巴的神道」（摩8:14）}
