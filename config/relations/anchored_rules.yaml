# Anchored kinship rules (REL-01): Step 6.05 emits a kinship edge only where a
# verse states it in a slot pattern, both names resolved through the
# pericope's own MENTIONS. The slot decides the direction, never id order.
#
# Loaded by scripts/relation_extraction/anchored_rules.py (load_config).
#   P1_child_of     P 的(長|次…)?兒子/女兒 C(、C)*    C SON_OF / DAUGHTER_OF P
#   P2_is_child_of  C 是 P 的兒子/女兒                C SON_OF / DAUGHTER_OF P
#   P3_begot        給 F (又|也)?生(了)? C(、C)*      F FATHER_OF C
#   P4_wife         H 的妻(子)? W                     SPOUSE_OF, sorted pair, first item only
#
# Decisions (docs/records/2026-10-04_kg_batch1_plan.md, W1):
#   begot      K1  gei: only 「給F生C」 emits FATHER_OF (「拉結生約瑟」 is a mother);
#                  father: every 「F生C」; off: no P3
#   surface    K2  declared: a span resolves only as its entity's canonical name
#                  or alias (a homophone NER span absorbed into another entity
#                  does not); any: every NER span
#   list_stop  Q3  cont: a list item followed by 的 owns the next clause and ends
#                  the list, kept only as the first item right at the slot end
#                  (jer 38:6 keeps 瑪基雅); all: never kept; off: no stop
#   lexicon_types  review 2b: an Event/Object/Theme name such as 「兒子大衛」
#                  would swallow the slot, so the tokenizer knows only these
#   lexicon_types and slot_types are final types (entities.jsonl type with
#                  config/curated/entity_overrides.yaml applied); deny_ids never
#                  fill a slot whatever their type
#
# The character sets and patterns are copied verbatim from the W1 simulator
# docs/records/2026-10-04_kg_fix/batch1/w1_1A/anchored_w1.py; prev_ok and
# trail_ok are each added to delim.
version: 1

begot: gei
surface: declared
list_stop: cont

lexicon_types: [Person, Place, Group]
slot_types: [Person]
deny_ids: ['group:yehehua']   # 上帝/耶和華: 「你是上帝的兒子」 is no kinship edge
min_name_len: 2

delim: "、，；。：（）「」『』！？ \n"
list_sep: '、和與及'
# what may sit right before a name (a name glued to a preceding hanzi is a substring)
prev_ok: '是叫名給和與及的就又也並乃從到在對向同為生娶了'
# single characters that cannot continue a name: a name followed by one of these ends there
trail_ok: '的生是就又也並作在說和與及同從到為等都所被將便乃要上下來去起往向對給把叫名娶有因年歲活死共一二三四五六七八九十百千各之後時這那王長不沒未卻已曾必若既還才再亦仍'
sentence_end: '。；：！？'

# child_re's one group is 兒子 (SON_OF) or 女兒 (DAUGHTER_OF)
child_re: '的(?:長|次|三|四|五|六|七|小)?(兒子|女兒)(?:是|有|就是|名叫|叫)?'
begot_re: '(?:又|也)?生(?:了)?'
wife_re: '的妻(?:子)?(?:是|名叫|叫)?'
is_child_re: '是'

# Same-name guard, pass 1 (K2 「同名時 abstain」, §6 #12). A SON_OF, DAUGHTER_OF or
# FATHER_OF hit with parent P and child C abstains, logged in conflicts, when
#   homonym_ids   P or C is a known homonym node (reason homonym, checked first);
#                 Q2 seed: 彼得 and the apostle 約翰 (「你是約翰的兒子西門」 jhn 1:42
#                 would make 彼得 the apostle's son)
#   other_parent  true: C already has a parent other than P in the curated,
#                 prior or llm rows; a mother counts (reason other_parent)
# Pass 2 (Q4) runs over the hits pass 1 kept:
#   disagreement  true: when C's anchored hits name 2 or more different parents
#                 (a mother counts; one parent in several verses is one), C is
#                 a merged homonym node (亞撒利雅 has 11 anchored fathers) and
#                 every parent hit of C abstains (reason anchored_disagreement).
#                 以掃 FATHER_OF 耶烏施 (gen 36:14) goes too: 1ch 7:10 gives
#                 耶烏施 the father 比勒罕.
# P4 SPOUSE_OF hits are never guarded.
guard:
  other_parent: true
  homonym_ids: ['person:bide', 'person:yuehan（shitu）']
  disagreement: true
