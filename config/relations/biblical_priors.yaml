# Biblical Relation Priors — High-confidence canonical relations from biblical
# scholarship. Loaded by scripts/relation_extraction/priors_loader.py during
# Phase R3 to bypass LLM classification for facts that are universally agreed.
#
# This file is INTENTIONALLY a starter set (~60 relations spanning patriarchs,
# Davidic line, gospel/apostolic figures). It is *additive* — extend it with
# additional consensus relations as needed. Treated as oracle by the
# evaluation harness (precision/recall against priors).
#
# Schema:
#   - head_canonical : canonical_name on the head Entity in Neo4j
#   - relation       : must exist in biblical_relations.yaml
#   - tail_canonical : canonical_name on the tail Entity in Neo4j
#   - source         : Bible reference, audit only (not used by extraction logic)
#   - notes          : optional remarks
#
# Resolution:
#   priors_loader.py looks up canonical_name -> entity_id via Neo4j.
#   If either side is missing, the prior is logged and skipped (not an error).

version: "1.0"
description: "Biblical scholarship priors (genealogy, kingdoms, apostolic figures)"

