# KG probes: facts that must (or must not) hold in the graph.
#
# Read by scripts/validate_kg.py (check PROBES; R6 also counts its kinship
# probes, R2 uses substring_probes, R6 uses female_persons). Plan:
# docs/records/2026-10-04_kg_data_layer_fix_plan.md §3.6. Every fact was
# checked against live Neo4j and output/embedding_queue.jsonl on 2026-10-04.
# Several describe the TARGET state and fail today on purpose (marked
# "fails today"). PROBES (and R6 for its kinship probes) is ratcheted per id:
# the baseline stores the ids of the failing probes, any other probe failing
# is a regression even if the total stays the same, and --ratchet only removes
# ids, so each fix batch turns its probes green one by one. A new probe that
# fails today enters the baseline only through `validate_kg --accept PROBES`
# (or R6), a reviewed approval: --ratchet never adds a failure.
# The probes W1 added that say "fails today" (1A's kin-esau-father-of-jalam,
# edge-no-dan-near-jordan, edge-no-galilee-in-nazareth; 1B's nine xref
# probes) are kept out of the stored ids on purpose: they must pass once W1
# is loaded and are never --accept'ed in, so every live run before W1 (prod,
# the batch-0 staging) reports these 12 as PROBES new.
#
# Fact kinds (expect: present | absent, except book_region):
#   relation      head, rel, tail            (head)-[rel]->(tail) between entities
#   mention       source, entity, rollup?    MENTIONS from that Pericope/Chunk id; rollup: true
#                                            also accepts a mention from any chunk of the pericope
#   event_anchor  event, pericope            export_event_registry's anchor rule (chunk -> parent)
#   alias         entity, alias              alias listed on the entity
#   xref          source, target, provenance CROSS_REFERENCES; provenance curated | tsk | any
#   book_region   entity, max                MENTIONS of the entity whose first position lies in the
#                                            book name (e.g. 馬可福音 → 馬可) must be <= max
# `check` names the §3.6 item a probe guards.
version: 1

