# R2: a P/P/G MENTIONS edge is contaminated when every body occurrence of its
# span has a left neighbour in `left` or a right neighbour in `right`, i.e. it
# only ever appears inside a longer name. Neighbour sets are from the 2026-10
# audit (docs/records/2026-10-04_kg_fix/mentions/a4_contam.py).
substring_probes:
  馬利亞: {left: 撒, right: ""}                     # 撒馬利亞
  以利亞: {left: "", right: 撒實敬薩利他巴}          # 以利亞撒/實/敬/薩/利…
  利亞: {left: 迦烏撒加比尼敘瑪他, right: ""}        # 撒迦利亞/烏利亞/敘利亞…
  以利: {left: "", right: 加法押雅戶約拿撒蓿米薩突}  # 以利加拿/以利法/以利押…
  迦勒: {left: 米, right: 底}                       # 迦勒底 / 米迦勒
  撒拉: {left: 布, right: 鐵旦弗}                   # 尼布撒拉旦/撒拉鐵
  亞拿: {left: "", right: 突尼米伯哈}               # 亞拿突/亞拿尼亞
  哈拿: {left: "", right: 尼篾}                     # 哈拿尼/哈拿篾
  西拉: {left: 西摩, right: ""}                     # 西西拉
  腓力: {left: "", right: 斯}                       # 腓力斯
  亞伯: {left: "", right: 尼底頓‧}                  # 亞伯尼歌/亞伯‧米何拉
  約拿: {left: "", right: 達}                       # 約拿達
  閃: {left: 一, right: 電爍亮耀開躲避}              # 閃電/閃爍
  含: {left: 包隱蘊, right: 着怒笑羞忍淚冤恨糊有}    # 含怒/含笑…

