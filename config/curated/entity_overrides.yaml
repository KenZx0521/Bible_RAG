# Curated entity overrides: an entity's final type, its id unchanged.
#
# Loaded by scripts/entity_extraction/entity_overrides.py (load_overrides,
# final_type). Step 10.2 (cleanup_noise_entities.py --actions yehehua) relabels
# Neo4j, PostgreSQL and Qdrant from this file; the offline Step 6.05 types
# entities.jsonl rows through final_type() before domain/range, so both see
# the graph as 10.2 leaves it.
#
# Fields per entity id:
#   label   one of Person, Place, Group, Event, Object, Theme (check_identity.TYPE_LABELS)
#   reason  why (free text, not read by code)
# Any other field, another label or a repeated id fails the load.
#
# Minimal on purpose (batch 1A, docs/records/2026-10-04_kg_batch1_plan.md):
# batch 1D extends it (D9) and points H7's allowlist at it.
version: 1

overrides:
  group:yehehua:
    label: Person
    reason: 'D9：保留 id，型別改 Person'
