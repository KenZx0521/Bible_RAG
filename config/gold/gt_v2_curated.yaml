kay_review:
  - qid: PERSON_QUESTION_013
    issue: 評分問題
    detail: >-
      題目用 CUNP 拼法「大利烏」（題目不改，日後由 query_aliases 處理）。答案欄已依 cunp_spelling 改為「大流士」（但6:1）。
      v1 下三組設定都回答「經文沒有描述」，評分卻判為正確（稽核 G04）。請決定這題要不要排除或加評分備註。
  - qid: VERSE_LOOKUP_001
    issue: 題目與答案用字不一致
    detail: >-
      v1 答案要點用「祂／不至」、reference_answer 用「他／不致」，彼此矛盾。答案欄已依機械替換與 CUNP 規則逐字對齊約3:16
      （上帝／他／不致），兩者不再矛盾；題目「神如何表達祂對世人的愛」依規定未改。請決定題目是否保留原樣。
  - qid: VERSE_LOOKUP_020
    issue: 答案欄自相矛盾（未修改）
    detail: >-
      答案要點作「等候耶和華的必重新得力」，reference_answer 作「但那等候耶和華的必從新得力」。服務文字賽40:31 作「重新得力」，
      「從新」是和合本舊譯。建議 reference_answer 改「重新」；未自行修改。
