# GT v2 的人工判斷（ragdata.gt.curated）。其餘修改全由規則產生，見 ragdata/src/ragdata/gt/。
#
# quote_fixes：改寫式引文，原文確定者改回服務文字（verse_units.text）。
#   before 是規則階段（errata、機械替換、CUNP、着/甚麼/裏/鍊、‧）做完後該欄位裏恰好出現一次的字串；
#   after 的每個子句都必須是服務文字。範圍：「」內引文，以及 VERSE_LOOKUP 逐字背誦的答案要點與
#   reference_answer（機械替換門檻 4 字以下的短子句不會自動改，逐字背誦時要人工補齊）。
#   reference_answer 中的間接引語（第三人稱轉述，如 VL_025「律法書不可離開他的口」）是合法轉述，不改。
# quote_exempt：「」內不是經文引文的子句（術語、節期名、主題標籤、情節概括、詩篇篇題），G-GT 引文檢查只略過這些。
# kay_review：不自行修改、交 Kay 裁決的題目。
schema: ragdata.gt_v2_curated.v1

