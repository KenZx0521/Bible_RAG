# diff_kg allowances for the batch-0 P1 equivalence rebuild (prod vs staging).
# Measured 2026-10-04: these three are the only differences across labels,
# relationships, ee_edges, mentions, xrefs, entity_ids, descriptions (verbatim),
# aliases and the registry.
#
# All three are the same four SON_OF edges. The SON_OF edge set is identical
# on both sides (659 = 659, same head/tail pairs); only extraction_phase and
# source_pericope_id differ on these four:
#   person:yage->person:yisa (gen:28:1), person:bianyamin->person:yage
#   (gen:35:1), person:bianyamin->person:lajie (gen:35:1),
#   person:dawei->person:yexi (1ch:29:2).
# Cause (corrected 2026-10-06; this header first blamed first-import-wins
# inside one import): output/relations.jsonl has one row per (head, relation,
# tail), 0 duplicate keys, and its rows for the four carry provenance (phase
# 4, 4, 4 and 2), which the staging rebuild keeps. Prod still holds phase-5
# inverse copies with no source pericope (confidence 0.891) from an older
# import: import_relations_neo4j's apoc.merge.relationship set properties only
# on create, so later imports never refreshed an existing edge (REL-10).
# Batch 1A fixes it: 6.05 keeps one row per key and 6.1 SETs all properties.
# The entries below are unchanged; their reason strings keep the 2026-10-04
# wording, which this header supersedes.
version: 1
allow:
  - section: ee_edges
    key: "SON_OF phase=2 source=-"
    delta: 1
    reason: "same SON_OF edge set; first-imported duplicate decides extraction_phase (onCreate-only merge)"
  - section: ee_edges
    key: "SON_OF phase=4 source=-"
    delta: 3
    reason: "same SON_OF edge set; first-imported duplicate decides extraction_phase (onCreate-only merge)"
  - section: ee_edges
    key: "SON_OF phase=5 source=-"
    delta: -4
    reason: "same SON_OF edge set; first-imported duplicate decides extraction_phase (onCreate-only merge)"
