    key: "SON_OF phase=2 source=-"
    delta: 1
    reason: "same SON_OF edge set; first-imported duplicate decides extraction_phase (onCreate-only merge)"
  - section: ee_edges
    key: "SON_OF phase=4 source=-"
    delta: 3
    reason: "same SON_OF edge set; first-imported duplicate decides extraction_phase (onCreate-only merge)"
  - section: ee_edges
