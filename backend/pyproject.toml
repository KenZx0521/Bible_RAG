[project]
name = "bible-rag-backend"
version = "0.1.0"
description = "Bible RAG Backend API with FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.7.0,<1.9.0",
    "neo4j>=5.25.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
