<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="問一個聖經問題，看答案、核對經文出處。">
  <title>聖經問答</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f6f0e4'/%3E%3Cpath d='M7 2h2v4h4v2H9v6H7V8H3V6h4z' fill='%23a32517'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/answer.css">
  <link rel="stylesheet" href="/css/graph.css">
  <link rel="stylesheet" href="/css/graph-nodes.css">
  <link rel="stylesheet" href="/css/reader.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="nameplate" id="nameplate" href="/">聖經問答</a>
      <p class="masthead-note" id="masthead-note">依和合本修訂版回答</p>
      <a class="ask-again" id="ask-again" href="/" hidden>再問一題</a>
    </header>

    <main>
      <section class="home" id="home">
        <form class="ask" id="ask-form" novalidate>
          <h1 class="ask-title"><label for="ask-input">想問聖經什麼？</label></h1>
          <p class="ask-lede">用一句話問就好。答案會附上經文出處，點一下就能對照經文。</p>
          <div class="ask-row">
            <input class="ask-input" id="ask-input" name="q" type="text" autocomplete="off"
              enterkeyhint="send" placeholder="例如：約瑟是誰？" aria-describedby="ask-message">
            <button class="button" type="submit">提問</button>
          </div>
          <p class="ask-message" id="ask-message" aria-live="polite"></p>
        </form>
        <section class="examples" aria-labelledby="examples-title">
          <h2 class="slug" id="examples-title">可以這樣問</h2>
          <ul class="example-list" id="examples"></ul>
        </section>
        <noscript><p class="ask-message is-error">這個頁面需要啟用 JavaScript 才能提問。</p></noscript>
      </section>

      <section class="asked" id="asked" hidden>
        <h1 class="question" id="question" tabindex="-1"></h1>

        <div class="waiting" id="waiting" hidden>
          <p class="waiting-line" id="waiting-line" role="status"></p>
          <div class="waiting-rule" aria-hidden="true"><span></span></div>
          <p class="waiting-foot">
            <span id="waiting-elapsed"></span>
            <button class="link-button" id="waiting-cancel" type="button">換一個問題</button>
          </p>
        </div>

        <div class="failure" id="failure" role="alert" hidden>
          <p class="failure-message" id="failure-message"></p>
          <p class="failure-actions">
            <button class="button" id="retry" type="button">重試</button>
            <button class="link-button" id="failure-home" type="button">換一個問題</button>
          </p>
        </div>

        <div class="result" id="result" hidden>
          <article class="answer" id="answer" aria-label="回答"></article>
          <aside class="result-side" aria-label="答案怎麼找到的">
            <div class="result-side-inner" id="graph-host"></div>
          </aside>
          <section class="sources" id="sources" aria-labelledby="sources-title">
            <h2 class="slug" id="sources-title">經文來源</h2>
            <p class="sources-empty" id="sources-empty" hidden>這題沒有找到相關的經文段落。</p>
            <ol class="source-list" id="source-list"></ol>
            <p class="result-foot"><a class="ask-again ask-again-foot" id="ask-again-foot" href="/">再問一題</a></p>
          </section>
        </div>
      </section>
    </main>

    <footer class="colophon">
      <p>回答由 AI 依和合本修訂版經文產生，可能有誤，請以經文為準。</p>
      <p class="colophon-build" id="colophon-build"></p>
    </footer>
  </div>

  <dialog class="reader" id="reader" aria-labelledby="reader-title">
    <div class="reader-sheet">
      <header class="reader-head">
        <span class="reader-numeral" id="reader-numeral" aria-hidden="true"></span>
        <div class="reader-titles">
          <p class="reader-book" id="reader-book"></p>
          <h2 class="reader-title" id="reader-title"></h2>
          <p class="reader-ref" id="reader-ref"></p>
        </div>
        <button class="reader-close" id="reader-close" type="button">關閉</button>
      </header>
      <div class="reader-body" id="reader-body" tabindex="0" role="region" aria-labelledby="reader-title"></div>
      <footer class="reader-foot">和合本修訂版</footer>
    </div>
  </dialog>
</body>
</html>
