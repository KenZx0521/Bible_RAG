    g: [G02, G12]
    evidence: G12（另有 11 個缺號，全部在前一節的「有古卷加」註腳）
    definition: status 為 omitted_variant 的 slot 數
  omitted_slot_keys:
    value: [mat.18.11, mat.23.14, mrk.7.16, mrk.15.28, luk.17.36, luk.23.17,
            jhn.5.4, act.8.37, act.15.34, act.24.7, act.28.29]
    g: [G02, G12]
    evidence: G02（10 個幽靈節）＋ G12（路17:36 只在註腳）；canonical_full.jsonl 實測
    definition: status 為 omitted_variant 的 slot_key 集合（不計順序）
  slot_rows:
    value: 31103
    g: [G12]
    evidence: G12；31,092 + 11
    definition: verse_slots.jsonl 列數
  superscriptions:
    value: 116
    g: [G01, G10]
    evidence: G01（詩篇篇題 116 篇）、G10
    definition: kind=superscription 的 chapter_texts 數
  superscription_chars:
    value: 1490
    g: [G01, G10]
    evidence: G01（116 篇／1,490 字）
    definition: 篇題 text_pdf 字元數總和
  book_divisions:
    value: 5
    g: [G10]
    evidence: gap_pdf_canonical/g6_headings_markers.json psalm_book_divisions=5；與 G10 同類的章層非經文文字
    definition: kind=book_division 的 chapter_texts 數
  selah_markers:
    value: 70
    g: [G09, G10]
    evidence: G10（細拉 70 個）、g7_invariants ann_selah=70
    definition: verse_units 中 type=selah 的 marker 總數
  speakers:
    value: 33
    g: [G09, G10, G69]
    evidence: G09（雅歌說話者 PDF 有 33 個）
    definition: speakers.jsonl 列數
  headings:
