# PDF count contract for G-COUNT (design §8). Every value is an absolute count
# verified against the 66 PDFs during the audit; it is never ratcheted. The
# struct legacy_* counts are the exception: they count the rows of the old
# output/ that the legacy map must carry over (design §3.3), so dropping old
# rows from legacy_ids.jsonl turns G-COUNT red.
#   value       expected count (or, for *_keys, the exact set of ids)
#   g           audit findings (REPORT.md) behind the number
#   evidence    where the number was measured
#   definition  how G-COUNT counts it (gates/counts.py implements each key)
# The G24 parallel-reference figures (608 headings / 995 refs / 1,073 pairs) are
# not checked until their conversion rules are written down (design §2.8).
schema: ragdata.pdf_counts.v1

text:
  books:
    value: 66
    g: [G04, G13]
    evidence: REPORT §2.1（bible_pdf/ 66 卷、66 份版權頁）
