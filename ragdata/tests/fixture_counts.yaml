# G-COUNT expectations of the text records for the six fixture PDFs that
# test_build_text.py builds (rut, jon, hab, zep, ezr, mrk). Tallied from the audit's
# canonical_full.jsonl (an independent parser), not from ragdata's own output; the
# footnote name spans from the audit's underline alignment (g4c: none in these books).
# Psalms and Song of Songs are not among them, so superscriptions, divisions and
# speakers are 0 here; the 66-book build checks them against pdf_counts.yaml.
schema: ragdata.pdf_counts.v1
