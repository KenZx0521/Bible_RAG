  present_slots: {value: 1198, g: [G12]}
  omitted_slots: {value: 2, g: [G02, G12]}
  omitted_slot_keys: {value: [mrk.7.16, mrk.15.28], g: [G02, G12]}
  slot_rows: {value: 1200, g: [G12]}
  superscriptions: {value: 0, g: [G10]}
  superscription_chars: {value: 0, g: [G10]}
  book_divisions: {value: 0, g: [G10]}
