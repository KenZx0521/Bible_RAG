[project]
name = "bible-rag-evaluation"
version = "0.1.0"
description = "Bible RAG evaluation system with RAGAS and custom metrics"
requires-python = ">=3.11"
dependencies = [
    # RAG API client
    "httpx>=0.27.0",
    # Database
    "asyncpg>=0.29.0",
    # Evaluation frameworks — pinned: metric formulas differ across RAGAS
    # versions (answer_correctness weights, noncommittal rules), so an
    # unpinned range is a reproducibility hazard for published numbers.
    "ragas==0.4.3",
    # LLM integration
    "langchain-anthropic>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.3.0",
    "anthropic>=0.40.0",
    # Semantic similarity
    "sentence-transformers>=3.0.0",
    # Visualization
    "plotly>=5.24.0",
    "jinja2>=3.1.0",
    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # CLI / Progress
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    # Settings
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
