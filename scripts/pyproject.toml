[project]
name = "bible-rag-scripts"
version = "0.1.0"
description = "Bible RAG database building and processing scripts"
requires-python = ">=3.10"
dependencies = [
    # Embeddings (BGE-M3)
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    # Entity extraction (CKIP + LLM)
    "ckip-transformers>=0.3.0",
    "anthropic>=0.18.0",
    "httpx>=0.25.0",
    "pypinyin>=0.49.0",
    # Database clients
    "neo4j>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.7.0",
    # Data models (bible_chunking uses pydantic)
    "pydantic>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[tool.uv]
package = false
